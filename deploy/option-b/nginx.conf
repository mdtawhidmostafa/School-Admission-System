# AdmissionOS gateway: three API replicas share one PostgreSQL source of truth.
# Request limits are per observed client IP (NAT/shared IP caveat documented).
# A blank map key skips rate accounting for non-mutations (including GETs).
upstream admission_cluster {
    least_conn;
    server backend:8080 max_fails=2 fail_timeout=10s;
    server backend2:8080 max_fails=2 fail_timeout=10s;
    server backend3:8080 max_fails=2 fail_timeout=10s;
}
map "$request_method:$uri" $admission_mutation_ip {
    default "";
    ~^POST:/api/classes$ $binary_remote_addr;
    ~^POST:/api/classes/[^/]+/holds$ $binary_remote_addr;
    ~^POST:/api/holds/[^/]+/confirm$ $binary_remote_addr;
    ~^DELETE:/api/holds/[^/]+$ $binary_remote_addr;
}
limit_req_zone $admission_mutation_ip zone=admission_mutations:10m rate=10r/s;
server {
    listen 80;
    server_tokens off;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 32k;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    # A gateway-generated 429 must be parseable by the React API client.
    error_page 429 = @admission_throttled;
    location @admission_throttled {
        internal;
        default_type application/json;
        add_header Retry-After 1 always;
        add_header Cache-Control no-store always;
        return 429 '{"error":"Too many requests; please retry","code":"RATE_LIMITED","requestId":"gateway"}';
    }
    location /api/ {
        limit_req zone=admission_mutations burst=20 nodelay;
        limit_req_status 429;
        proxy_pass http://admission_cluster/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Request-Id $request_id;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 3s;
        proxy_read_timeout 15s;
        # NEVER configure 'non_idempotent' retry: POST/DELETE may have committed
        # even if a response was lost. Nginx will not replay requests already sent.
        proxy_next_upstream error timeout http_502 http_503;
        proxy_next_upstream_tries 3;
    }
    location = /config.js { add_header Cache-Control "no-store"; }
    location / { try_files $uri $uri/ /index.html; }
}
